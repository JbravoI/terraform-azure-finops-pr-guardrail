name: Terraform FinOps Guardrail

on:
  workflow_call:
    inputs:
      terraform-working-directory:
        description: Directory containing the Terraform configuration.
        required: false
        type: string
        default: .
      policy-path:
        description: Path to the version-controlled FinOps policy file.
        required: false
        type: string
        default: policies/default-policy.yml
      terraform-version:
        description: Terraform CLI version used to create the plan.
        required: false
        type: string
        default: 1.9.8

permissions:
  contents: read
  pull-requests: write

jobs:
  guardrail:
    name: Terraform cost and policy review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out pull-request code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Create Terraform plan JSON
        working-directory: ${{ inputs.terraform-working-directory }}
        shell: bash
        run: |
          terraform init -input=false -backend=false
          terraform plan -input=false -lock=false -out="$RUNNER_TEMP/terraform-finops.tfplan"
          terraform show -json "$RUNNER_TEMP/terraform-finops.tfplan" > "$RUNNER_TEMP/terraform-finops-plan.json"
      - name: Evaluate cost and policy guardrail
        uses: ./action
        with:
          plan-path: ${{ runner.temp }}/terraform-finops-plan.json
          policy-path: ${{ inputs.policy-path }}
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
